services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cambio
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: cambio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://cambio:changeme@db:5432/cambio

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
