services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambio
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: cambio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambio"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cambio}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-cambio}
      API_TOKEN: ${API_TOKEN}
      DEV_MODE: ${DEV_MODE:-false}
      SERVER_MASTER_KEY: ${SERVER_MASTER_KEY}
      PUBLIC_PARAMS_PATH: configs/biometric_parameters.json
    volumes:
      - ./models:/app/models:ro


  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN}
      DEV_MODE: ${DEV_MODE:-true}
      PYTHONPATH: /app
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./results:/app/results:ro
      - ./dataset:/app/dataset:ro

volumes:
  pgdata:

