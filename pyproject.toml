[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-cambio"
version = "0.1.0"
description = "Zero-Knowledge Cancelable Multimodal Biometrics via Chaotic Hashing"
readme = "README.md"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyd", "*.so", "*.dll"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/chaos"]
addopts = "-v --tb=short"
